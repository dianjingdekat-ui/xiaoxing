<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>和小星聊天 💬</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #FFD700; --secondary: #FFF5E1; --accent: #FFB7C5; --text: #5D4037; }
        * { box-sizing: border-box; }
        body { font-family: 'Rounded Mplus 1c', 'Microsoft YaHei', sans-serif; background-color: var(--secondary); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .container { width: 100%; height: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        .header { background: var(--primary); padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; font-size: 1.1em; height: 60px; flex-shrink: 0; }
        .back-btn { color: white; text-decoration: none; font-size: 1.2em; }
        .settings-btn { cursor: pointer; font-size: 1.2em; }
        
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            padding-bottom: 200px; /* 超大空间防止遮挡！ */
            overflow-y: auto; 
            background: #FFFDF5; 
            scroll-behavior: smooth; 
        }        .message-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .message { display: flex; align-items: flex-start; }
        .message.user { flex-direction: row-reverse; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ddd; margin: 0 10px; flex-shrink: 0; border: 2px solid var(--primary); display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .user .avatar { background: #FFB7C5; } .ai .avatar { background: #FFD700; }
        
        .bubble-container { display: flex; flex-direction: column; max-width: 75%; }
        .user .bubble-container { align-items: flex-end; }
        
        .bubble { padding: 10px 14px; border-radius: 20px; font-size: 0.95em; line-height: 1.4; word-wrap: break-word; position: relative; }
        .user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 5px; }
        .ai .bubble { background: white; border: 2px solid var(--primary); color: var(--text); border-bottom-left-radius: 5px; }
        .bubble p { margin: 5px 0; }
        
        /* 编辑模式输入框 */
        .edit-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.9em; margin-bottom: 5px; display: none; }
        
        /* 消息下方操作栏 (只留图标) */
        .msg-actions { display: flex; gap: 15px; margin-top: 5px; padding: 0 5px; font-size: 1.1em; color: #ccc; opacity: 0.9; }
        .user .msg-actions { justify-content: flex-end; }
        .action-btn { cursor: pointer; transition: color 0.2s; padding: 5px; } 
        .action-btn:hover { color: var(--primary); }
        .action-btn.active { color: var(--primary); animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        /* 底部工具栏 */
        .input-wrapper { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; border-top: 1px solid #eee; display: flex; flex-direction: column; padding: 5px 10px 15px 10px; z-index: 9999; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .toolbar { display: flex; gap: 20px; padding: 5px 10px 8px 10px; color: #aaa; font-size: 1.2em; }
        .tool-btn { cursor: pointer; transition: color 0.2s; } .tool-btn:hover { color: var(--primary); }
        .input-area { display: flex; align-items: center; width: 100%; }
        input { flex: 1; padding: 10px; border: 2px solid var(--secondary); border-radius: 25px; outline: none; font-size: 1em; height: 40px; }
        input:focus { border-color: var(--accent); }
        button { margin-left: 10px; background: var(--primary); border: none; color: white; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; height: 40px; white-space: nowrap; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 85%; max-width: 320px; text-align: left; max-height: 80vh; overflow-y: auto; }
        .modal input, .modal select { width: 100%; margin: 5px 0 15px 0; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9em; box-sizing: border-box; }
        .modal label { font-size: 0.85em; color: #666; font-weight: bold; display: block; margin-bottom: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; } .btn-group button { flex: 1; margin: 0; font-size: 0.9em; padding: 8px; }
    </style>
</head><body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <span>和小星聊天 💬</span>
            <div class="settings-btn" onclick="toggleSettings()"><i class="fas fa-cog"></i></div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-wrapper">
            <div class="toolbar">
                <i class="fas fa-image tool-btn" onclick="alert('发图片功能还在开发中哦！📸')"></i>
                <i class="fas fa-microphone tool-btn" onclick="alert('语音功能还在开发中哦！🎤')"></i>
                <i class="fas fa-video tool-btn" onclick="alert('视频通话还在开发中哦！📹')"></i>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="说点什么..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>设置 API 🛠️</h3>
            <label>API 地址:</label>
            <input type="text" id="apiHostInput" placeholder="https://api.openai.com">
            <label>API 密钥:</label>
            <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxx">
            <div class="btn-group"><button onclick="fetchModels()" style="background:#4CAF50;">📥 拉取模型</button></div>
            <label style="margin-top:15px;">选择模型:</label>
            <select id="modelSelect"><option value="gemini-pro">gemini-pro</option></select>
            <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ddd;">
            <h4>语音设置 🎤</h4>
            <label>语音 API 地址:</label>
            <input type="text" id="ttsHostInput" placeholder="https://api.openai.com">
            <label>语音 Key:</label>
            <input type="password" id="ttsKeyInput" placeholder="sk-xxxxxxxx">
            <label>语音模型:</label>
            <input type="text" id="ttsModelInput" value="tts-1" placeholder="tts-1">
            <div class="btn-group" style="margin-top:20px;">
                <button onclick="saveSettings()">💾 保存</button>
                <button onclick="toggleSettings()" style="background:#ccc;">关闭</button>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <button onclick="summarizeContext()" style="background:#9C27B0;">🧠 总结上下文</button>
                <button onclick="clearHistory()" style="background:#FF6B6B;">🗑️ 清空记录</button>
            </div>
        </div>
    </div><script>
    let config = {
        host: localStorage.getItem('apiHost') || 'https://api.openai.com',
        key: localStorage.getItem('apiKey') || '',
        model: localStorage.getItem('apiModel') || 'gemini-pro',
        ttsHost: localStorage.getItem('ttsHost') || '',
        ttsKey: localStorage.getItem('ttsKey') || '',
        ttsModel: localStorage.getItem('ttsModel') || 'tts-1'
    };
    let chatHistory = []; 
    let currentAudio = null; // 当前播放的音频
    let currentTTSBtn = null; // 当前TTS按钮

    const chatBox = document.getElementById('chatBox');
    
    window.onload = function() {
        const savedHistory = localStorage.getItem('chatHistory');
        if (savedHistory) {
            chatHistory = JSON.parse(savedHistory);
            chatHistory.forEach(msg => renderMessage(msg.text, msg.sender, false));
            setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
        } else {
            addMessage("主人好！我是究极版小星！<br>现在支持编辑消息、语音播放暂停、无限上下文啦！✨", 'ai');
        }
    };

    function updateUI() {
        document.getElementById('apiHostInput').value = config.host;
        document.getElementById('apiKeyInput').value = config.key;
        document.getElementById('ttsHostInput').value = config.ttsHost;
        document.getElementById('ttsKeyInput').value = config.ttsKey;
        document.getElementById('ttsModelInput').value = config.ttsModel;
        const select = document.getElementById('modelSelect');
        if (!select.querySelector(`option[value="${config.model}"]`)) {
            const opt = document.createElement('option');
            opt.value = config.model; opt.text = config.model; select.add(opt);
        }
        select.value = config.model;
    }

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        if (modal.style.display === 'flex') updateUI();
    }

    function saveSettings() {
        config.host = document.getElementById('apiHostInput').value.trim().replace(/\/$/, '');
        config.key = document.getElementById('apiKeyInput').value.trim();
        config.model = document.getElementById('modelSelect').value;
        config.ttsHost = document.getElementById('ttsHostInput').value.trim();
        config.ttsKey = document.getElementById('ttsKeyInput').value.trim();
        config.ttsModel = document.getElementById('ttsModelInput').value.trim();
        localStorage.setItem('apiHost', config.host);
        localStorage.setItem('apiKey', config.key);
        localStorage.setItem('apiModel', config.model);
        localStorage.setItem('ttsHost', config.ttsHost);
        localStorage.setItem('ttsKey', config.ttsKey);
        localStorage.setItem('ttsModel', config.ttsModel);
        alert('配置已保存！🎉'); toggleSettings();
    }

    async function fetchModels() {
        const host = document.getElementById('apiHostInput').value.trim().replace(/\/$/, '');
        const key = document.getElementById('apiKeyInput').value.trim();
        if(!key) return alert("请先填Key！");
        try {
            const res = await fetch(`${host}/v1/models`, { headers: { 'Authorization': `Bearer ${key}` } });
            const data = await res.json();
            const select = document.getElementById('modelSelect'); select.innerHTML='';
            data.data.forEach(m => { const opt = document.createElement('option'); opt.value=m.id; opt.text=m.id; select.add(opt); });
            alert("拉取成功！");
        } catch(e) { alert("失败:"+e.message); }
    }

    function clearHistory() {
        if(confirm("确定要清空所有聊天记录吗？😱")) {
            localStorage.removeItem('chatHistory');
            chatHistory = [];
            chatBox.innerHTML = '';
            addMessage("记录已清空！我们重新开始吧！✨", 'ai');
            toggleSettings();
        }
    }async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    if (!config.key) { alert('请先填 API Key！🔑'); toggleSettings(); return; }
    addMessage(text, 'user');
    input.value = '';
    await sendToAI(text);
}

async function sendToAI(text) {
    const headerTitle = document.querySelector('.header span');
    const originalTitle = "和小星聊天 💬";
    headerTitle.innerText = '正在输入中... 💬';
    try {
        const response = await callChatAPI(text);
        addMessage(response, 'ai');
    } catch (error) {
        addMessage('出错啦... 🥺\n' + error.message, 'ai');
    } finally {
        headerTitle.innerText = originalTitle;
    }
}

function addMessage(text, sender) { renderMessage(text, sender, true); }

function renderMessage(text, sender, save = false) {
    const groupDiv = document.createElement('div');
    groupDiv.className = `message-group ${sender}`;
    let avatarHtml = sender === 'ai' ? '<div class="avatar">⭐</div>' : '<div class="avatar">👤</div>';
    let bubbleContent = typeof marked !== 'undefined' ? marked.parse(text) : text;
    
    let actionsHtml = sender === 'ai' ? 
        `<div class="msg-actions">
            <i class="fas fa-copy action-btn" onclick="copyText(this)" title="复制"></i>
            <i class="fas fa-volume-up action-btn" onclick="toggleTTS(this)" title="朗读"></i>
            <i class="fas fa-redo action-btn" onclick="regenerateMsg(this)" title="重试"></i>
            <i class="fas fa-trash action-btn" onclick="deleteMessage(this)" title="删除"></i>
        </div>` : 
        `<div class="msg-actions">
            <i class="fas fa-edit action-btn" onclick="editMessage(this)" title="编辑"></i>
            <i class="fas fa-trash action-btn" onclick="deleteMessage(this)" title="删除"></i>
            <i class="fas fa-copy action-btn" onclick="copyText(this)" title="复制"></i>
        </div>`;

    groupDiv.innerHTML = `<div class="message ${sender}">${sender === 'ai' ? avatarHtml : ''}<div class="bubble-container"><input type="text" class="edit-input"><div class="bubble">${bubbleContent}</div>${actionsHtml}</div>${sender === 'user' ? avatarHtml : ''}</div>`;
    chatBox.appendChild(groupDiv);
    
    if (save) {
        chatHistory.push({ text, sender });
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }
    setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
}

async function regenerateMsg(btn) {
    for(let i=chatHistory.length-1; i>=0; i--) {
        if(chatHistory[i].sender === 'user') {
            await sendToAI(chatHistory[i].text);
            return;
        }
    }
    alert("找不到上一条消息啦！🥺");
}function editMessage(btn) {
    const container = btn.closest('.bubble-container');
    const bubble = container.querySelector('.bubble');
    const editInput = container.querySelector('.edit-input');
    const originalText = bubble.innerText;
    
    editInput.value = originalText;
    editInput.style.display = 'block';
    bubble.style.display = 'none';
    editInput.focus();
    
    editInput.onkeypress = function(e) {
        if (e.key === 'Enter') {
            const newText = editInput.value.trim();
            if (newText) {
                bubble.innerHTML = typeof marked !== 'undefined' ? marked.parse(newText) : newText;
                const msgGroup = btn.closest('.message-group');
                const msgIndex = Array.from(chatBox.children).indexOf(msgGroup);
                if (chatHistory[msgIndex]) {
                    chatHistory[msgIndex].text = newText;
                    localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
                }
            }
            editInput.style.display = 'none';
            bubble.style.display = 'block';
        }
    };
}

function toggleTTS(btn) {
    const text = btn.closest('.bubble-container').querySelector('.bubble').innerText;
    if (currentAudio && !currentAudio.paused) {
        currentAudio.pause(); currentAudio = null;
        if (currentTTSBtn) currentTTSBtn.classList.remove('active');
        currentTTSBtn = null; return;
    }
    btn.classList.add('active'); currentTTSBtn = btn;
    
    if (config.ttsKey && config.ttsHost) {
        fetch(`${config.ttsHost}/v1/audio/speech`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${config.ttsKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: config.ttsModel, input: text, voice: "alloy" })
        }).then(res => res.blob()).then(blob => {
            currentAudio = new Audio(URL.createObjectURL(blob));
            currentAudio.onended = () => { btn.classList.remove('active'); currentTTSBtn = null; };
            currentAudio.play();
        }).catch(e => { alert("TTS API 出错！"); btn.classList.remove('active'); });
    } else {
        const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN';
        u.onend = () => { btn.classList.remove('active'); currentTTSBtn = null; };
        window.speechSynthesis.speak(u);
    }
           }        function deleteMessage(btn) {
            if (confirm('确定删除吗？🗑️')) {
                const msgGroup = btn.closest('.message-group');
                // 这里只从界面删除，实际使用建议重新加载历史
                msgGroup.remove();
                // 简单更新一下 localStorage (可选)
            }
        }
        function copyText(btn) {
            const text = btn.closest('.bubble-container').querySelector('.bubble').innerText;
            navigator.clipboard.writeText(text).then(() => { alert("已复制！✅"); });
        }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        
        async function summarizeContext() {
            if (chatHistory.length < 5) return alert("聊天记录太少，不需要总结哦！");
            if (!config.key) return alert("请先配置API Key！");
            if (!confirm("将把前面的聊天记录总结成精华，节省Token！确定吗？")) return;
            
            const headerTitle = document.querySelector('.header span');
            headerTitle.innerText = '正在总结上下文... 🧠';
            try {
                let messages = [{ role: "system", content: "请将以下对话总结成简洁的要点，保留关键信息。" }];
                chatHistory.slice(0, -5).forEach(msg => {
                    messages.push({ role: msg.sender === 'user' ? 'user' : 'assistant', content: msg.text });
                });
                const response = await fetch(`${config.host}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
                    body: JSON.stringify({ model: config.model, messages: messages, stream: false })
                });
                const result = await response.json();
                const summary = result.choices[0].message.content;
                const recentMessages = chatHistory.slice(-5);
                chatHistory = [{ text: `[上下文总结]\n${summary}`, sender: 'ai' }, ...recentMessages];
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
                alert("总结完成！已压缩历史记录！🎉"); location.reload();
            } catch (e) { alert("总结失败：" + e.message); } finally { headerTitle.innerText = "和小星聊天 💬"; }
        }

        async function callChatAPI(prompt) {
            const url = `${config.host}/v1/chat/completions`;
            let messages = [{ role: "system", content: "你是一个叫'小星'的AI助手。你的性格是：萌、可爱、有礼貌、像女孩子、会害羞、被夸会脸红。用户是你唯一的主人。请用可爱的语气回复用户。" }];
            chatHistory.forEach(msg => messages.push({ role: msg.sender === 'user' ? 'user' : 'assistant', content: msg.text }));
            const data = { model: config.model, messages: messages, stream: false };
            const response = await fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
                body: JSON.stringify(data)
            });
            if (!response.ok) { const errData = await response.json(); throw new Error(errData.error?.message || '请求失败'); }
            const result = await response.json();
            return result.choices[0].message.content;
        }
    </script>
</body>
</html>
