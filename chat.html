<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和小星聊天 💬</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #FFD700; --secondary: #FFF5E1; --accent: #FFB7C5; --text: #5D4037; }
        body { font-family: 'Rounded Mplus 1c', 'Microsoft YaHei', sans-serif; background-color: var(--secondary); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .header { background: var(--primary); padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; font-size: 1.1em; }
        .back-btn { color: white; text-decoration: none; font-size: 1.2em; }
        .settings-btn { cursor: pointer; font-size: 1.2em; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #FFFDF5; scroll-behavior: smooth; }
        .message { margin-bottom: 15px; display: flex; align-items: flex-start; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ddd; margin: 0 10px; flex-shrink: 0; border: 2px solid var(--primary); display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .user .avatar { background: #FFB7C5; } .ai .avatar { background: #FFD700; }
        .bubble { max-width: 70%; padding: 12px 16px; border-radius: 20px; font-size: 0.95em; line-height: 1.5; word-wrap: break-word; position: relative; }
        .user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 5px; }
        .ai .bubble { background: white; border: 2px solid var(--primary); color: var(--text); border-bottom-left-radius: 5px; }
        .input-area { padding: 10px; background: white; border-top: 2px solid #eee; display: flex; align-items: center; }
        input { flex: 1; padding: 12px; border: 2px solid var(--secondary); border-radius: 25px; outline: none; font-size: 1em; }
        input:focus { border-color: var(--accent); }
        button { margin-left: 10px; background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; }
        .modal input { width: 90%; margin: 10px 0; }
        .typing-indicator { display: none; color: #888; font-size: 0.8em; margin-left: 60px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <span>和小星聊天 💬</span>
            <div class="settings-btn" onclick="toggleSettings()"><i class="fas fa-cog"></i></div>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="avatar">⭐</div>
                <div class="bubble">主人好！请点击右上角齿轮⚙️，填入你的 Gemini Key 就可以和小星聊天啦！✨</div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">小星正在思考... ⭐</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="说点什么..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3>设置 API 🛠️</h3>
        
        <p style="text-align:left; font-size:0.8em; margin-bottom:5px;">API 地址 (Host):</p>
        <input type="text" id="apiHostInput" placeholder="例如: https://oneapi.xxx.com">
        
        <p style="text-align:left; font-size:0.8em; margin-bottom:5px;">API 密钥 (Key):</p>
        <input type="password" id="apiKeyInput" placeholder="粘贴你的 Key">
        
        <button onclick="saveSettings()">保存配置</button>
        <button onclick="toggleSettings()" style="background:#ccc; margin-top:10px;">关闭</button>
    </div>
</div> <script>
    // 初始化
    let apiKey = localStorage.getItem('geminiKey');
    let apiHost = localStorage.getItem('geminiHost') || 'https://generativelanguage.googleapis.com'; // 默认官方
    const chatBox = document.getElementById('chatBox');

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        if (modal.style.display === 'flex') {
            document.getElementById('apiKeyInput').value = apiKey || '';
            document.getElementById('apiHostInput').value = apiHost;
        }
    }

    function saveSettings() {
        const hostInput = document.getElementById('apiHostInput').value.trim();
        const keyInput = document.getElementById('apiKeyInput').value.trim();

        if (keyInput) {
            // 处理地址：去掉末尾斜杠
            let cleanHost = hostInput.replace(/\/$/, '');
            // 如果用户没填地址，就用默认的
            if (!cleanHost) cleanHost = 'https://generativelanguage.googleapis.com';

            localStorage.setItem('geminiKey', keyInput);
            localStorage.setItem('geminiHost', cleanHost);
            
            apiKey = keyInput;
            apiHost = cleanHost;
            
            alert('配置已保存！🎉');
            toggleSettings();
        } else {
            alert('Key 不能为空哦！🥺');
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        if (!apiKey) {
            alert('请先去设置里填 API Key！🔑');
            toggleSettings();
            return;
        }

        addMessage(text, 'user');
        input.value = '';

        const typing = document.getElementById('typingIndicator');
        typing.style.display = 'block';

        try {
            const response = await callGeminiAPI(text);
            typing.style.display = 'none';
            addMessage(response, 'ai');
        } catch (error) {
            typing.style.display = 'none';
            addMessage('出错啦... 🥺\n' + error.message, 'ai');
        }
    }

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        let avatarHtml = sender === 'ai' ? '<div class="avatar">⭐</div>' : '<div class="avatar">🐷</div>';
        let bubbleHtml = `<div class="bubble">${typeof marked !== 'undefined' ? marked.parse(text) : text}</div>`;
        
        if (sender === 'ai') msgDiv.innerHTML = avatarHtml + bubbleHtml;
        else msgDiv.innerHTML = bubbleHtml + avatarHtml;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function callGeminiAPI(prompt) {
        // 拼接完整URL
        // 注意：中转站通常也是兼容这个路径的 /v1beta/models/gemini-pro:generateContent
        // 如果你的中转站路径不一样，可能需要在这里调整
        const url = `${apiHost}/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
        
        const data = {
            contents: [{
                parts: [{
                    text: "你是一个叫'小星'的AI助手。你的性格是：萌、可爱、有礼貌、像女孩子、会害羞、被夸会脸红。用户是你唯一的主人。请用可爱的语气回复用户。用户说：" + prompt
                }]
            }]
        };

        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || '请求失败');
        }

        const result = await response.json();
        if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
             return result.candidates[0].content.parts[0].text;
        } else {
            return "小星不知道说什么... (空回复)";
        }
    }
</script>
</body>
</html>
